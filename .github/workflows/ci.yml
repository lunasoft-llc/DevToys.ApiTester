name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ApiTester.slnx
      - run: dotnet test ApiTester.slnx -c Release --no-restore
      - run: dotnet pack src/DevToys.ApiTester/DevToys.ApiTester.csproj -c Release --no-restore -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
